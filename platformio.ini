; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documenation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; There are numerous configurations of NightDriver that can be built here.  For example, the
; simplest is the DEMO config.  The HUB75 matrix project is the mesermizer.  You simply set
; default_envs to the project you wish to build.  There are project configs for various different
; NightDriver projects ranging from WiFi LED Strip to the simple lantern candle:
;
; demo          Simple WS2812B strip controller, runs a rainbow on PIN 5
; ledstrip      Waits for color data over wifi, so used for home displays, etc
; spectrum      M5StickCPlus project, a spectrum analyzer, on 48x16 WS2812B matrix
; mesmerizer    HUB75 info panel with audio effects, weather, info, etc

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documenation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; There are numerous configurations of NightDriver that can be built here.  For example, the
; simplest is the DEMO config.  The HUB75 matrix project is the mesermizer.  You simply set
; default_envs to the project you wish to build.  There are project configs for various different
; NightDriver projects ranging from WiFi LED Strip to the simple lantern candle:
;
; demo          Simple WS2812B strip controller, runs a rainbow on PIN 5
; ledstrip      Waits for color data over wifi, so used for home displays, etc
; spectrum      M5StickCPlus project, a spectrum analyzer, on 48x16 WS2812B matrix
; mesmerizer    HUB75 info panel with audio effects, weather, info, etc

[platformio]
default_envs =
build_cache_dir = .pio/build_cache
extra_configs =
    custom_*.ini ; This file can be created in the root directory to store user defined devices and environments.

; ==================
; Shared Library Definitions
;
[shared_libs]
FastLED               = symlink://${PROJECT_DIR}/.pio/shared_libdeps/FastLED
Adafruit_BusIO        = symlink://${PROJECT_DIR}/.pio/shared_libdeps/Adafruit_BusIO
Adafruit_GFX_Library  = symlink://${PROJECT_DIR}/.pio/shared_libdeps/Adafruit_GFX_Library
arduinoFFT            = symlink://${PROJECT_DIR}/.pio/shared_libdeps/arduinoFFT
ESPAsyncWebServer     = symlink://${PROJECT_DIR}/.pio/shared_libdeps/ESPAsyncWebServer
ArduinoJson           = symlink://${PROJECT_DIR}/.pio/shared_libdeps/ArduinoJson

AnimatedGIF           = symlink://${PROJECT_DIR}/.pio/shared_libdeps/AnimatedGIF
TJpg_Decoder          = symlink://${PROJECT_DIR}/.pio/shared_libdeps/TJpg_Decoder
U8g2                  = symlink://${PROJECT_DIR}/.pio/shared_libdeps/U8g2
Bounce2               = symlink://${PROJECT_DIR}/.pio/shared_libdeps/Bounce2
M5Unified             = symlink://${PROJECT_DIR}/.pio/shared_libdeps/M5Unified
M5GFX                 = symlink://${PROJECT_DIR}/.pio/shared_libdeps/M5GFX
ESP_MPDMA             = symlink://${PROJECT_DIR}/.pio/shared_libdeps/ESP32_HUB75_LED_MATRIX_PANEL_DMA_Display
ESP_HUB75             = symlink://${PROJECT_DIR}/.pio/shared_libdeps/esp-hub75

; ==================
; Base configuration
;
; Options that are used (or extended) in all device sections (and hence environments) are defined here

[base]
upload_port     =
monitor_port    =
build_type      = release
board_build.filesystem = littlefs
upload_speed    = 2000000
monitor_speed   = 115200
build_flags     = -std=gnu++26
                  -g1 ; line-table-only debug info for the Arduino core and every library
                  -Os ; the espressif32 platform's _bare.py appends -Os after this list, so the -Ofast that
                      ; used to be here never actually took effect. -Os is what we have always shipped,
                      ; and it is not optional: -Ofast grew the image ~309KB and overflowed kitch's
                      ; 1.7MB app partition (110.5%).
                  -ffunction-sections
                  -fdata-sections
                  -fno-exceptions ; Drop the C++ exception machinery entirely: unwind tables, .eh_frame,
                                  ; .gcc_except_table, typeinfo and __cxa_*. On kitch this shrank the app
                                  ; image (firmware.bin) from 1,820,368 to 1,667,472 bytes, -153KB, which
                                  ; is the difference between overflowing the 1.7MB app0 partition and
                                  ; fitting comfortably. Nothing in the image ever unwinds a stack.
                                  ; Unrecoverable errors now call Panic() (include/nd_panic.h) instead of
                                  ; throwing. This has to live in build_flags rather than build_src_flags
                                  ; because libraries like FastLED ask for -fno-exceptions themselves, and
                                  ; our -fexceptions was overriding that request.
build_src_flags = -Wformat=2 ; Warnings for our code only, excluding libraries
                  -Wformat-truncation
                  -Wstack-usage=4096

# Exclude libraries that we don't control from 'pio check'.
# format is error number(optional :path_with_wildcards(optional :line_number))
check_flags     = cppcheck: --suppress=*:*src/uzlib/src/*

shared_lib_deps = fastled/FastLED               @ 3.10.9
                  adafruit/Adafruit BusIO       @ ^1.17.2
                  adafruit/Adafruit GFX Library @ ^1.12.1
                  kosme/arduinoFFT              @ ^2.0.4
                  esp32async/ESPAsyncWebServer  @ ^3.7.10
                  bblanchon/ArduinoJson         @ ^7.4.2

                  bitbank2/AnimatedGIF          @ ^2.2.3
                  Bodmer/TJpg_Decoder           @ ^1.1.0
                  olikraus/U8g2                 @ ^2.36.12
                  thomasfredericks/Bounce2      @ ^2.72.0
                  m5stack/M5Unified             @ ^0.2.7
                  m5stack/M5GFX                 @ ^0.2.3
                  #mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.15
                  ; "Name = <url>" is PIO's custom-name syntax; the name pins the install folder
                  ; so tools/setup_shared_libs_cli.py and ${shared_libs.ESP_MPDMA} agree on it.
                  ESP32 HUB75 LED MATRIX PANEL DMA Display = https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA
                  ; ^0.3.3 is the floor for IDF 6 GDMA support (PR #87); ^0.1.0 kept us on 0.1.7.
                  esphome/esp-hub75 @ ^0.3.6

lib_deps        = ${shared_libs.FastLED}
                  ${shared_libs.Adafruit_BusIO}
                  ${shared_libs.Adafruit_GFX_Library}
                  ${shared_libs.arduinoFFT}
                  ${shared_libs.ArduinoJson}

; pio pkg update keeps adding these back and pio LDF keeps finding deps
lib_ignore      = RPAsyncTCP, ESPAsyncTCP

; This partition table is the default and fits everything in 4M of flash without OTA.
board_build.partitions = config/partitions_custom_noota_v3.csv

; Libraries that are common to ALL devices rendering 2D graphics
graphics_deps =
                ${shared_libs.AnimatedGIF}
                ${shared_libs.TJpg_Decoder}

oled_deps   = ${shared_libs.U8g2}
bounce_deps = ${shared_libs.Bounce2}
network_deps = WiFi
               ${shared_libs.ESPAsyncWebServer}
               ; AsyncTCP is deliberately NOT shared. ESPAsyncWebServer hard-depends on
               ; ESP32Async/AsyncTCP, and the LDF matches transitive deps by owner+name against
               ; the registry - it will not accept a .pio-link as satisfying that. Sharing it gave
               ; every networked env both a real AsyncTCP copy *and* the link, and the registry
               ; copy got re-fetched. Let the registry own it once instead.
               esp32async/AsyncTCP @ ^3.5.0

; Placeholder for legacy custom_*.ini references (IR remote flags removed)
[remote_flags]
build_flags     =
build_src_flags =

; ===============
; Device sections
; Sections starting with "dev_" contain general settings for a particular type of device.
; They extend the "base" config, both in general and in terms of build flags and dependencies,
; where applicable.

[dev_esp32]
extends         = base
board           = esp32dev
monitor_speed   = 115200
upload_speed    = 921600
build_flags     = ${base.build_flags}

[dev_esp32_s3]
extends         = base
board           = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
monitor_speed   = 115200
upload_speed    = 1000000
build_flags     = ${base.build_flags}

[dev_heltec_wifi]
extends         = base
board           = heltec_wifi_kit_32
monitor_speed   = 115200
upload_speed    = 921600
build_flags     = ${base.build_flags}
                  -DARDUINO_HELTEC_WIFI_KIT_32=1
build_src_flags = -DUSE_SCREEN=1
lib_deps        = ${base.lib_deps}
                  ${base.network_deps}
                  ${base.network_deps}
                  ${base.oled_deps}

[dev_lolin_d32_pro]
extends         = base
board           = lolin_d32_pro
monitor_speed   = 115200
upload_speed    = 921600

[dev_m5]
extends         = base
monitor_speed   = 115200
upload_speed    = 1500000
build_src_flags = -DUSE_SCREEN=1
                  -DTOGGLE_BUTTON_0=37
                  -DTOGGLE_BUTTON_1=39

lib_deps        = ${base.lib_deps}
                  ${base.network_deps}
                  ${base.network_deps}
                  ${base.bounce_deps}
                  ${shared_libs.M5GFX}
                  ${shared_libs.M5Unified}

[dev_m5stick_c]
extends         = dev_m5
board           = m5stick-c
board_build.variant = m5stack_stickc
build_src_flags = ${dev_m5.build_src_flags}
                  -DM5STICKC=1
board_build.partitions = config/partitions_custom_noota_v3.csv

[dev_m5stick_c_plus]
extends         = dev_m5
board           = m5stick-c                         ; Requires the M5StickC Plus (note the Plus)
board_build.variant = m5stack_stickc_plus
build_src_flags = ${dev_m5.build_src_flags}
                  -DM5STICKCPLUS=1
board_build.partitions = config/partitions_custom_noota_v3.csv

[dev_m5stick_c_plus2]
extends         = dev_m5
board           = m5stick-c                         ; Requires the M5StickC Plus2 (note the Plus2)
board_build.variant = m5stack_stickc_plus2
upload_speed    = 2000000
build_src_flags = ${dev_m5.build_src_flags}
                  -DM5STICKCPLUS2=1
board_build.partitions = config/partitions_custom_8M_v3.csv
board_upload.flash_size = 8MB

[dev_wrover]
extends         = base
board           = esp-wrover-kit
monitor_speed   = 115200
upload_speed    = 1500000
lib_deps        = ${base.lib_deps}
                  ${base.network_deps}
                  ${base.network_deps}
                  adafruit/Adafruit ILI9341 @ ^1.5.10

[dev_mesmerizer]
extends         = dev_wrover
board           = esp-wrover-kit
upload_speed    = 4000000
monitor_speed   = 115200
board_build.partitions  = config/partitions_custom_8M_v3.csv
board_upload.flash_size = 8MB

; Adafruit MatrixS3, a 2MB PSRAM respin of their earlier SAMD product.
; https://www.adafruit.com/product/5778
[dev_matrixs3]
extends        = dev_esp32_s3
board          = adafruit_matrixportal_esp32s3
build_flags    = ${dev_esp32_s3.build_flags}
                 ${psram_common_flags.build_flags}
lib_deps       = ${dev_esp32_s3.lib_deps}
                 ${base.graphics_deps}
                 ${base.network_deps}
                 ${base.bounce_deps}
board_build.partitions = config/partitions_custom_8M_v3.csv
board_build.arduino.memory_type = qio_qspi

; https://docs.waveshare.com/ESP32-S3-RGB-Matrix
; This will probably need to change to something with QSPI...
[dev_ws_s3_hub75]
extends        = dev_esp32_s3
; board          = adafruit_matrixportal_esp32s3
board          = esp32-s3-devkitc-1
build_flags    = ${dev_esp32_s3.build_flags}
                 -DARDUINO_USB_CDC_ON_BOOT=1
                 -DUSE_I2S_AUDIO=1
                 -DUSE_ES7210_AUDIO=1
                 ; Shared I2S bus for the ES7210 ADC (mics) and ES8311 DAC (speaker).
                 ; Audio on this board is a codec, not a bare digital mic: the
                 ; ESP32 must generate MCLK/BCLK/LRCK and configure the codec
                 ; over I2C before any samples appear on DIN.
                 -DI2S_MCLK_PIN=12
                 -DI2S_WS_PIN=38    ; LRCK
                 -DI2S_BCLK_PIN=43
                 -DI2S_DOUT_PIN=21  ; to ES8311 DSDIN
                 -DINPUT_PIN=39     ; from ES7210 ASDOUT
                 -DAUDIO_PA_PIN=11  ; NS4150B speaker-amp enable
                 ; I2C bus shared by ES7210 (0x40), ES8311 (0x18),
                 ; QMI8658 (0x6B), SHTC3 (0x70), and PCF85063 (0x51).
                 -DI2C_SDA_PIN=47
                 -DI2C_SCL_PIN=48
                 ${psram_common_flags.build_flags}
lib_deps       = ${dev_esp32_s3.lib_deps}
                 ${base.graphics_deps}
                 ${base.network_deps}
                 ${base.bounce_deps}
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi
board_build.partitions = config/partitions_custom_8M_v3.csv

; This describes a specific MODULE from Espressif. It may appear on different BOARDS.
[dev_esp32-s3-n16r2]
extends         = dev_esp32_s3
build_flags     = ${base.build_flags}
                 -DARDUINO_USB_CDC_ON_BOOT=1
                  ${psram_common_flags.build_flags}
board_build.arduino.memory_type = qio_qspi
board_build.partitions = config/partitions_custom_8M_v3.csv
board_upload.flash_size = 16MB
#board_upload.maximum_size = 16777216


[dev_yulc]
extends         = dev_esp32-s3-n16r2
build_flags     = ${dev_esp32-s3-n16r2.build_flags}
build_src_flags = -DCONTROLLER_TYPE_YULC=1 ;
                  -DPOWER_LIMIT_MW=1000  ; Limit to 1 Watts (~.2 Amp at 5V)
                  -DUSE_ALL_NETWORKING=1
                  -DLED_PIN0=1 # These pins are defined by the hardware
                  -DLED_PIN1=2 # GPIO 2

; ===================
; Capability sections
; The following sections contain build flags and/or dependencies to enable a particular capability
; or module in specific environments. They applicable option(s) - build_flags, lib_deps or both -
; are included in the environments in question.
;
; Note that these sections do not extend "base", as they are basically feature toggles.

; Build flags for use of PSRAM
[psram_common_flags]
build_flags     = -DUSE_PSRAM=1
                  -DBOARD_HAS_PSRAM=1
build_src_flags =

# https://docs.espressif.com/projects/esp-chip-errata/en/latest/esp32/03-errata-description/esp32/cpu-read-and-write-errors-related-to-access-sequence.html
[psram_lx6_flags]
build_flags     = ${psram_common_flags.build_flags}
                  -mfix-esp32-psram-cache-issue
build_src_flags =

# [ttgo_deps]
# build_flags     =
# build_src_flags =
# lib_deps        = https://github.com/Xinyuan-LilyGO/TTGO-T-Display
#                   bodmer/TFT_eSPI @ ^2.5.43

; ================================================================
; Basic environment section, automatically inherited by all others

; ===================
; Capability Mixins (Ingredients)
; These provide ATOMIC features that can be mixed into any environment.

[feature_wifi]
build_src_flags = -DENABLE_WIFI=1

[feature_ota]
build_src_flags = -DENABLE_OTA=1

[feature_remote]
build_src_flags = -DENABLE_REMOTE=1

[feature_audio]
build_src_flags = -DENABLE_AUDIO=1
                  -DMAX_SAMPLES=512

[feature_audio_128]
build_src_flags = -DENABLE_AUDIO=1
                  -DMAX_SAMPLES=128

[feature_espmpdma]
build_src_flags = -DUSE_MPDMA_HUB75=1
lib_deps        = ${shared_libs.ESP_MPDMA}

[feature_esphub75]
build_src_flags = -DUSE_ESP_HUB75=1
lib_deps        = ${shared_libs.ESP_HUB75}

; ===================
; Project Logic Templates (Recipes)
; These contain only the core logic for a project, no hardware or capabilities.

[project_demo]
build_src_flags = -DDEMO=1
                  -DEFFECTS_DEMO=1

[project_spectrum]
build_src_flags = -DSPECTRUM=1
                  -DEFFECTS_SPECTRUM=1

[project_minimal]
build_src_flags = -DEFFECTS_MINIMAL=1

[project_hexagon]
build_src_flags = -DHEXAGON=1
                  -DEFFECTS_HEXAGON=1
                  -DNUM_LEDS=271
                  -DHEX_RINGS=10

; ===================
; Arduino Core Overlays
; These provide specific platform/partition overrides for Arduino v3 testing.

[arduino_v3_noota]
board_build.partitions = config/partitions_custom_noota_v3.csv

[arduino_v3_8m]
board_build.partitions = config/partitions_custom_8M_v3.csv

[env]
# platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
framework       = arduino
build_type      = release
build_unflags   = -std=gnu++2a -std=gnu++2b
                  -gdwarf-4 ; the framework appends "-gdwarf-4 -ggdb" after our build_flags. -gdwarf-4 implies
                  -ggdb     ; debug level 2, so it silently overrode our -g1. Drop both; -g1 is now the last -g.
                  -fexceptions ; the espressif32 platform injects -fexceptions; strip it so that the
                              ; -fno-exceptions in [base] build_flags has the last word.
lib_extra_dirs  = ${PROJECT_DIR}/lib
monitor_filters = esp32_exception_decoder
extra_scripts   = pre:tools/src_debug_flags.py
                  pre:tools/setup_shared_libs_pio.py
                  pre:run_audits.py
                  pre:install_intelhex.py
                  pre:tools/bake_site.py
                  post:tools/merge_image.py
board_build.embed_files = site/dist/index.html.gz
                          site/dist/index.js.gz
                          site/dist/favicon.ico.gz
board_build.embed_txtfiles = config/timezones.json

; ================================================================
; Shared embed assets (avoid duplication across projects)

[embed_matrix_assets]
build_flags     =
build_src_flags =
board_build.embed_files = assets/bmp/brokenclouds.jpg
                          assets/bmp/brokencloudsnight.jpg
                          assets/bmp/clearsky.jpg
                          assets/bmp/clearnight.jpg
                          assets/bmp/fewclouds.jpg
                          assets/bmp/fewcloudsnight.jpg
                          assets/bmp/lowreslogo.jpg
                          assets/bmp/mist.jpg
                          assets/bmp/mistnight.jpg
                          assets/bmp/rain.jpg
                          assets/bmp/rainnight.jpg
                          assets/bmp/scatteredclouds.jpg
                          assets/bmp/scatteredcloudsnight.jpg
                          assets/bmp/showerrain.jpg
                          assets/bmp/showerrainnight.jpg
                          assets/bmp/snow.jpg
                          assets/bmp/snownight.jpg
                          assets/bmp/thunderstorm.jpg
                          assets/bmp/thunderstormnight.jpg
                          assets/gif/colorsphere.gif
                          assets/gif/atomic.gif
                          assets/gif/pacman.gif
                          assets/gif/threerings.gif
                          assets/gif/banana.gif
                          assets/gif/tesseract.gif
                          assets/gif/firelog.gif
                          assets/gif/nyancat.gif
                          ${env.board_build.embed_files}

; ================================================================
; Common project configurations
;

[mesmerizer_config]
build_flags     = ${base.build_flags}
                  ${psram_lx6_flags.build_flags}
build_src_flags = ${feature_wifi.build_src_flags}
                  ${feature_ota.build_src_flags}
                  ${feature_remote.build_src_flags}
                  ${feature_audio.build_src_flags}
                  ${feature_espmpdma.build_src_flags}
                  -DMESMERIZER=1
                  -DSHOW_FPS_ON_MATRIX=0
                  -DSHOW_VU_METER=1
                  -DEFFECTS_FULLMATRIX=1
                  -DCOLOR_ORDER=EOrder::RGB
                  -DTIME_BEFORE_LOCAL=2
                  -DMATRIX_WIDTH=64
                  -DMATRIX_HEIGHT=32
                  -DIR_REMOTE_PIN=39
                  -DTOGGLE_BUTTON_0=0

lib_deps        = ${feature_espmpdma.lib_deps}
                  ${base.lib_deps}
                  ${base.network_deps}
                  ${base.network_deps}
                  ${base.graphics_deps}
                  ${base.bounce_deps}

board_build.embed_files = ${embed_matrix_assets.board_build.embed_files}

; ====================
; Project Environments
;
; These define specific projects with their base board type, project defines, and effect sets

[env:demo]
extends         = dev_esp32
build_src_flags = ${project_demo.build_src_flags}
                  -DPROJECT_NAME="\"Demo\""
                  -DMATRIX_WIDTH=144
                  -DTIME_BEFORE_LOCAL=0

[m5demobase]
build_flags     =
build_src_flags = ${feature_wifi.build_src_flags}
                  ${feature_audio.build_src_flags}
                  -DEFFECTS_FULLMATRIX=1
                  -DUSE_MATRIX=1
                  -DMATRIX_WIDTH=64
                  -DMATRIX_HEIGHT=32
                  -DSHOW_VU_METER=1
                  -DTIME_BEFORE_LOCAL=2
                  -DENABLE_WEBSERVER=0
                  -DCOLORDATA_SERVER_ENABLED=0
                  -DDEFAULT_EFFECT_INTERVAL=0
                  -DLED_PIN0=-1
                  -DDEFAULT_INFO_PAGE=2

lib_deps        = ${base.graphics_deps}
board_build.embed_files = ${embed_matrix_assets.board_build.embed_files}

; M5Stick C Plus demo - extends the base matrix demo configuration
[env:m5plusdemo]
extends         = dev_m5stick_c_plus2
build_src_flags = ${dev_m5stick_c_plus2.build_src_flags}
                  ${m5demobase.build_src_flags}
                  -DPROJECT_NAME="\"M5Plus2Demo\""

lib_deps        = ${dev_m5stick_c_plus2.lib_deps}
                  ${m5demobase.lib_deps}
board_build.embed_files = ${m5demobase.board_build.embed_files}

[env:ledstrip]
extends         = dev_heltec_wifi
build_src_flags = ${dev_heltec_wifi.build_src_flags}
                  ${project_minimal.build_src_flags}
                  ${feature_wifi.build_src_flags}
                  -DPROJECT_NAME='"Ledstrip"'
                  -DENABLE_WEBSERVER=0
                  -DWAIT_FOR_WIFI=1
                  -DTIME_BEFORE_LOCAL=5
                  -DCOLORDATA_SERVER_ENABLED=0
                  -DMATRIX_WIDTH=1152
                  -DNUM_LEDS=1152
                  -DDEFAULT_EFFECT_INTERVAL=20000
                  -DRING_SIZE_0=1
                  -DRING_SIZE_1=2
                  -DRING_SIZE_2=4
                  -DRING_SIZE_3=8
                  -DRING_SIZE_4=16

[env:spectrum2]
extends         = dev_m5stick_c_plus2
build_src_flags = ${dev_m5stick_c_plus2.build_src_flags}
                  ${project_spectrum.build_src_flags}
                  ${feature_wifi.build_src_flags}
                  ${feature_ota.build_src_flags}
                  ${feature_remote.build_src_flags}
                  ${feature_audio.build_src_flags}
                  -DEFFECTS_FULLMATRIX=1
                  -DUSE_MATRIX=1
                  -DPROJECT_NAME="\"Spectrum2\""
                  -DTIME_BEFORE_LOCAL=2
                  -DCOLORDATA_SERVER_ENABLED=0
                  -DDEFAULT_EFFECT_INTERVAL=60*60*24*5
                  -DLED_PIN0=26
                  -DRING_SIZE_0=24
                  -DMATRIX_WIDTH=48
                  -DMATRIX_HEIGHT=16
                  -DSHOW_VU_METER=1

lib_deps        = ${base.graphics_deps}
                  ${dev_m5stick_c_plus2.lib_deps}
board_build.embed_files = ${m5demobase.board_build.embed_files}

;===============
[env:mesmerizer]
extends         = dev_mesmerizer
build_flags     = ${mesmerizer_config.build_flags}
build_src_flags = ${mesmerizer_config.build_src_flags}
                  -DMESMERIZER=1
lib_deps        = ${mesmerizer_config.lib_deps}

board_build.embed_files = ${mesmerizer_config.board_build.embed_files}

[env:mesmerizer_lolin]
extends         = dev_lolin_d32_pro
build_flags     = ${mesmerizer_config.build_flags}
build_src_flags = ${mesmerizer_config.build_src_flags}
                  -DMESMERIZER=1
lib_deps        = ${mesmerizer_config.lib_deps}

board_build.embed_files = ${mesmerizer_config.board_build.embed_files}

[env:hexagon]
extends         = dev_esp32
build_src_flags = ${project_hexagon.build_src_flags}
                  ${feature_wifi.build_src_flags}
                  -DPROJECT_NAME="\"Hexagon\""
                  -DMATRIX_WIDTH=271
                  -DDEFAULT_EFFECT_INTERVAL=1000*20

lib_deps        = ${base.network_deps}
                  ${dev_esp32.lib_deps}

[env:matrixs3_mesmerizer]
extends = dev_matrixs3
build_src_flags = ${feature_espmpdma.build_src_flags}
                  -DPROJECT_NAME="\"Matrix S3/Mesmerizer\""
                  -DMATRIX_S3=1 ; better name: CONTROLLER_TYPE_ADAFRUIT_MATRIX_S3
                  -DMESMERIZER=1
                  -DEFFECTS_FULLMATRIX=1
                  -DUSE_ALL_NETWORKING=1
                  -DMATRIX_WIDTH=64
                  -DMATRIX_HEIGHT=32
                  # Note this is a 2MB PSRAM board -
                  # choose 64x64 OR Networking; you can't have both.
                  # -DMATRIX_HEIGHT=64
lib_deps        = ${dev_matrixs3.lib_deps}
                  ${feature_espmpdma.lib_deps}
board_build.embed_files = ${embed_matrix_assets.board_build.embed_files}

; Waveshare ESP32-S3-RGB-Matrix
; https://docs.waveshare.com/ESP32-S3-RGB-Matrix
; This is a weird board. It's a ESP32S3-WROOM-2 with 32MB...but not in the
;  module. The PSRAM is offboardand is only qpsi instead of opsi.  :-(
[env:ws_s3_hub75-64x64]
extends = dev_ws_s3_hub75
build_src_flags = ${feature_esphub75.build_src_flags}
                  -DPROJECT_NAME="\"Matrix S3/Mesmerizer\""
                  -DMESMERIZER=1
                  -DWAVESHARE_ESP32_S3_RGB_MATRIX=1 ; better name: CONTROLLER_TYPE_ESP32_S3_RGB_MATRIX
                  -DEFFECTS_FULLMATRIX=1
                  -DUSE_ALL_NETWORKING=1
                  -DMATRIX_WIDTH=64
                  -DMATRIX_HEIGHT=64
                  -DENABLE_AUDIO=1 ; For simulation.
lib_deps        = ${dev_ws_s3_hub75.lib_deps}
                  ${feature_esphub75.lib_deps}
board_build.embed_files = ${embed_matrix_assets.board_build.embed_files}

# "TinyLED" is a made up name for an S3 board that mounts an 8x8
# WS2812C-2020C grid onto the PCB, making it an awesome development
# board as it has a 64LED "strip" and the S3, which lets you have JTAG,
# power, console, and strip all from one USB-C cable.
# It's sold under a variety of names, but the biggest name is
# https://www.waveshare.com/esp32-s3-matrix.html
# https://www.waveshare.com/wiki/ESP32-S3-Matrix
#
# It's critical that we limit brightness on these. If you crash the device
# with all pixels at max white brightness, the LEDS WILL desolder themselves.
#
# Chip is ESP32-S3 (QFN56) (revision v0.2)
# Features: WiFi, BLE, Embedded Flash 4MB (XMC), Embedded PSRAM 2MB (AP_3v3)
[dev_tinyled]
extends         = dev_esp32_s3
build_flags     = ${dev_esp32_s3.build_flags}
                  ${psram_common_flags.build_flags}
                  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = ${dev_esp32_s3.build_src_flags}
                  -DLED_PIN0=14
                  -DCOLOR_ORDER=EOrder::RBG
                  -DBRIGHTNESS_MIN=2
                  -DBRIGHTNESS_MAX=4
                  -DCONTROLLER_TYPE_WAVESHARE_MATRIX_S3=1
board_upload.flash_size = 4MB
board_build.partitions = config/partitions_custom_noota_v3.csv

[env:tinyled-demo]
extends         = dev_tinyled
build_src_flags = ${dev_tinyled.build_src_flags}
                  -DTINYLED=1
                  -DDEMO=1
                  -DNUM_LEDS=64
                  -DPROJECT_NAME=\"TinyLED\"

[env:tinyled-hex]
extends         = dev_tinyled
build_src_flags = ${dev_tinyled.build_src_flags}
                  -DNUM_LEDS=271
                  -DHEXAGON=1
                  -DEFFECTS_HEXAGON=1
                  -DHEX_RINGS=10
                  -DUSE_ALL_NETWORKING=1
                  -DPROJECT_NAME=\"TinyHex\"
lib_deps        = ${dev_tinyled.lib_deps}
                  ${base.network_deps}

[env:yulc-hex]
extends          = dev_yulc
build_flags      = ${dev_yulc.build_flags}
build_src_flags  = ${dev_yulc.build_src_flags}
                   ; ${feature_audio.build_src_flags}
                   ${project_hexagon.build_src_flags}
                   -DUSE_ALL_NETWORKING=1
                   -DPROJECT_NAME=\"Yulc-Hex\"
lib_deps         = ${base.lib_deps}
                   ${base.network_deps}

